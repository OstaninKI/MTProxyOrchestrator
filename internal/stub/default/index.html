<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d12;
      --surface:   #13161e;
      --border:    #1e2130;
      --accent:    #5b8dee;
      --accent2:   #a78bfa;
      --text:      #e2e6f0;
      --muted:     #8892aa;
      --dim:       #3d4460;
      --r:         14px;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Dot grid */
    .bg-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(91,141,238,.18) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* Glow orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 560px; height: 560px;
      background: var(--accent);
      top: -120px; left: -80px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: var(--accent2);
      bottom: -100px; right: -60px;
      animation-delay: -6s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 56px 52px 48px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.03) inset,
        0 20px 60px rgba(0,0,0,.5),
        0 0 80px rgba(91,141,238,.05);
    }

    /* card shimmer border */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--r);
      padding: 1px;
      background: linear-gradient(135deg,
        rgba(91,141,238,.3) 0%,
        transparent 50%,
        rgba(167,139,250,.2) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box,
                    linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Icon ── */
    .icon-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #181c28, #1e2235);
      border: 1px solid var(--border);
      margin-bottom: 28px;
      box-shadow: 0 0 0 8px rgba(91,141,238,.06), 0 4px 16px rgba(0,0,0,.4);
    }
    .icon-ring svg { width: 38px; height: 38px; }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(91,141,238,.1);
      border: 1px solid rgba(91,141,238,.25);
      color: #8ab4f8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 99px;
      margin-bottom: 22px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(.7); }
    }

    /* ── Heading ── */
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.025em;
      background: linear-gradient(135deg, var(--text) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 40px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Separator ── */
    .sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 32px;
    }

    /* ── Status pills ── */
    .status-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 7px 16px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .pill-icon {
      width: 7px; height: 7px;
      border-radius: 50%;
    }
    .pill-icon.green  { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,.5); }
    .pill-icon.yellow { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,.4);
                        animation: blink 3s ease-in-out infinite; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 40px 28px 36px; }
      h1    { font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="card">

    <div class="icon-ring">
      <!-- Spark / bolt icon -->
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#8ab4f8"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <!-- Lightning bolt -->
        <path d="M22 4L9 21h10l-3 13 19-17H25L22 4z"
              fill="url(#g1)" stroke="none"/>
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      In Development
    </div>

    <h1>Something New<br>Is on the Way</h1>
    <p class="sub">
      We're building something worth waiting for.
      Check back soon — it won't be long.
    </p>

    <div class="sep"></div>

    <div class="status-row">
      <div class="pill">
        <span class="pill-icon green"></span>
        Infrastructure ready
      </div>
      <div class="pill">
        <span class="pill-icon yellow"></span>
        Launch in progress
      </div>
    </div>

  </div>

</body>
</html>
